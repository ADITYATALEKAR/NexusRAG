version: "3.9"

services:
  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      RAG__ENV: production
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
