[project]
name = "nexusrag"
version = "0.1.0"
description = "NexusRAG - State-of-the-art retrieval operating system for enterprise RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.23.0",
    "python-magic>=0.4.27",
    "qdrant-client>=1.7.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
rag-cli = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
