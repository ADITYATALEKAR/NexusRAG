server:
  host: 0.0.0.0
  port: 8000
  workers: 1
  timeout_keep_alive: 30

security:
  api_key_required: false
  rate_limit_enabled: false
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:8000
  cors_allow_credentials: true

rate_limits:
  requests_per_minute: 60
  requests_per_hour: 1000
  burst_size: 10

logging:
  level: info
  format: json
