services:
  - type: web
    name: rag-api
    env: docker
    plan: standard
    healthCheckPath: /health/liveness
    envVars:
      - key: RAG__ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        fromService:
          type: pserv
          name: qdrant
          property: hostport
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString

  - type: pserv
    name: qdrant
    env: docker
    dockerfilePath: ./deploy/qdrant.Dockerfile
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10

  - type: redis
    name: redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
