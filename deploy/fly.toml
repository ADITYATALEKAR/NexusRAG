app = "rag-api"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[env]
RAG__ENV = "production"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

  [http_service.concurrency]
  type = "connections"
  hard_limit = 100
  soft_limit = 80

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "2gb"
